[workspace]
members = [
    "crates/mimus-wire",
    "crates/mimus-profile",
    "crates/mimus-emit",
    "crates/mimus-serve",
    "crates/mimus-calibrate",
]
resolver = "2"

[workspace.dependencies]
mimus-wire = { path = "crates/mimus-wire" }
mimus-profile = { path = "crates/mimus-profile" }
mimus-emit = { path = "crates/mimus-emit" }
mimus-serve = { path = "crates/mimus-serve" }
mimus-calibrate = { path = "crates/mimus-calibrate" }

bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
tokio = { version = "1.53.3", features = ["full"] }
clap = { version = "4.6.7", features = ["derive"] }
toml = { version = "1.2.2", default-features = false, features = ["std", "parse", "serde"] }

[package]
name = "mimus-epics"
version = "0.1.0"
edition = "2024"
description = "Mirrored IOC Model for Ultra-Scale Simulation of EPICS control systems: a self-calibrating PVAccess traffic generator"
license = "MIT"
repository = "https://github.com/clemkraw/mimus-epics"

[[bin]]
name = "mimus"
path = "src/main.rs"

[dependencies]
mimus-wire = { workspace = true }
mimus-profile = { workspace = true }
mimus-emit = { workspace = true }
mimus-serve = { workspace = true }
mimus-calibrate = { workspace = true }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
debug = 1
